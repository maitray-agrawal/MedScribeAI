<!doctype html>
<html lang="en" data-theme="primary">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAIDHYA — Clinical Intelligence | An AstraX System</title>
    <meta name="description" content="Sovereign, evidence-grounded clinical intelligence platform for healthcare workflows. Member of the AstraX Family." />
    
    <!-- Google Fonts: Fraunces (Headings), Inter (UI), IBM Plex Mono (Telemetry/Metadata), Noto Sans Devanagari & Tamil (Indian Scripts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Instant Theme Loader (Zero FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('vaidhya-theme') || 'primary';
          document.documentElement.setAttribute('data-theme', saved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
